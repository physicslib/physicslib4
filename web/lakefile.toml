name = "physicslib4-web"
version = "0.1.0"
defaultTargets = ["Site", "generate-site", "Tutorial", "generate-tutorial", "Manual", "generate-manual"]

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.35.0"

[[require]]
name = "versowebcomponents"
git = "https://github.com/leanprover/verso-web-components.git"
rev = "v4.35.0"

[[require]]
name = "physicslib4"
path = ".."

[[lean_lib]]
name = "Site"

[[lean_exe]]
name = "generate-site"
root = "Main"

[[lean_lib]]
name = "Book"
globs = ["Book.+"]

[[lean_lib]]
name = "Tutorial"
globs = ["Tutorial", "Tutorial.+"]

[[lean_exe]]
name = "generate-tutorial"
root = "TutorialMain"

[[lean_lib]]
name = "Manual"
globs = ["Manual", "Manual.+"]

[[lean_exe]]
name = "generate-manual"
root = "ManualMain"
