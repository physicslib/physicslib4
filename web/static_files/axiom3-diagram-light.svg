<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Two spacelike-separated diamonds inside a causal diamond</title>
  <desc id="desc">A large causal diamond B contains two smaller diamonds B1 and B2 side by side. Dashed light-cone lines at 45 degrees from B1 bound its causal future and past; B2 lies outside them, so B1 and B2 are spacelike separated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <polygon points="200,30 370,200 200,370 30,200" fill="#0f766e" fill-opacity="0.07" stroke="#0f766e" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="130" y1="245" x2="272.5" y2="102.5"/>
    <line x1="130" y1="245" x2="57.5" y2="172.5"/>
    <line x1="130" y1="155" x2="272.5" y2="297.5"/>
    <line x1="130" y1="155" x2="57.5" y2="227.5"/>
  </g>
  <polygon points="130,155 175,200 130,245 85,200" fill="#0f766e" fill-opacity="0.3" stroke="#0f766e" stroke-width="2"/>
  <polygon points="270,155 315,200 270,245 225,200" fill="#0f766e" fill-opacity="0.3" stroke="#0f766e" stroke-width="2"/>
  <g fill="#333" font-family="'Open Sans', Arial, sans-serif" font-weight="600" text-anchor="middle">
    <text x="200" y="70" font-size="20">B</text>
    <text x="130" y="207" font-size="16">B₁</text>
    <text x="270" y="207" font-size="16">B₂</text>
  </g>
  <line x1="20" y1="405" x2="20" y2="345" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="20" y1="405" x2="80" y2="405" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g fill="#64748b" font-family="serif" font-style="italic" font-size="16">
    <text x="28" y="352">t</text>
    <text x="76" y="398">x</text>
  </g>
</svg>
