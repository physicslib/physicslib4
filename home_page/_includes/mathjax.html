<!-- Load MathJax only on pages that ask for it (front matter `usemathjax: true`). -->
{% if page.usemathjax %}
  <!-- MathJax 3 configuration. kramdown emits inline math as \( … \) and display math as
       \[ … \], which MathJax 3 recognises by default; AMS equation numbering is kept. -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        tags: 'ams'
      }
    };
  </script>
  <!-- MathJax 3 from the jsDelivr CDN (the old cdn.mathjax.org has been retired). -->
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
{% endif %}
