name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# This workflow is the build/lint gate for pushes and pull requests. Building
# and deploying the blueprint + documentation to GitHub Pages is handled
# exclusively by `blueprint.yml` (on pushes to `main`). This workflow must NOT
# produce a `github-pages` artifact or deploy Pages, otherwise two such
# artifacts collide in a single run and `actions/deploy-pages` fails.
permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # history for the change check before the Verso site build
      - uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: true
          mk_all-check: true

      - name: Check declarations named in the blueprint exist
        run: |
          set -euo pipefail
          grep -rho '\\lean{[^}]*}' blueprint/src --include='*.tex' \
            | sed -e 's/^\\lean{//' -e 's/}$//' \
            | tr ',' '\n' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u > lean_decls.txt
          echo "Checking $(wc -l < lean_decls.txt) declarations named in the blueprint."
          ~/.elan/bin/lake exe checkdecls lean_decls.txt

      - name: Check documentation is in the present tense
        run: python3 scripts/check_temporal_wording.py

      # The Verso site build takes several minutes, so it runs only when the site, the library or
      # the toolchain changes. Without a usable base commit (new branch, manual run) it always runs.
      - name: Check whether the Verso site needs building
        id: site
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD \
             | grep -qE '^(web/|Physicslib4/|Physicslib4\.lean$|lean-toolchain$|lakefile\.toml$|lake-manifest\.json$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # Builds the Verso site in `web/` without deploying it (deployment is in `blueprint.yml`).
      # The site is served from `/physicslib4/site/`, so its pages must not use root-relative URLs.
      - name: Build the Verso site
        if: steps.site.outputs.build == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          ~/.elan/bin/lake exe cache get
          ~/.elan/bin/lake build
          ~/.elan/bin/lake exe generate-site --output _out/site
          if grep -rnoE '(href|src)="/[^/][^"]*"' _out/site --include='*.html'; then
            echo "Root-relative URLs found; they break under /physicslib4/site/." >&2
            exit 1
          fi
